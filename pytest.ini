[pytest]
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = --alluredir=allure-results

markers =
    ui: Маркировка для UI тестов
    slow: Маркировка для медленных тестов
    smoke: Маркировкадля смоук тестов
    critical: Маркировка для критичных тестов
    regression: Маркировка для регрессионных тестов
    authorization: Маркировка для тестов авторизации
    matrix: Маркировка для тестов матриц
    objects: Маркировка для тестов раздела /objects (Products и др.)
    directory: Маркировка для тестов раздела /directory (Merch Group Directory и др.)

# Примеры запуска UI-тестов:
#
#  - Генерация browser-state.json (однократно локально или в CI перед UI-набором):
#      python scripts/save_browser_state.py
#
#  - Только smoke-сценарий открытия Monitoring Matrix:
#      pytest -m "ui and matrix and smoke"
#  - Полный набор матричных UI-тестов:
#      pytest -m "ui and matrix"
#
#  - Smoke-набор по Products:
#      pytest -m "ui and objects and smoke" tests/objects
#  - Расширенный набор по Products:
#      pytest -m "ui and objects" tests/objects
#
#  - Smoke-набор по Merch Group Directory:
#      pytest -m "ui and directory and smoke" tests/directory
#  - Расширенный набор по Merch Group Directory:
#      pytest -m "ui and directory" tests/directory